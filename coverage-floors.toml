# Line coverage floors, one entry per workspace crate.
#
# CI's `rust` job measures line coverage while it runs the tests, and
# scripts/check-coverage.py fails the job when a crate is under its floor, when a
# crate is missing from the report, or when an entry here is incomplete.
#
#   floor   The whole-number percentage of the crate's lines under src/ that the
#           tests must execute. 100 means every line.
#   reason  One line saying why the floor is where it is.
#
# Floors only ratchet up. A change that raises a crate's coverage raises its floor
# in the same change, and lowering a floor needs a reason stated in review. There
# is no exclusion list: code that CI cannot exercise stays in the measurement and
# holds its crate's floor down where everyone can see it. See "Coverage" in
# CONTRIBUTING.md.
#
# A crate whose optional feature builds code the default build does not has a
# second entry for that build, [features."<crate>/<feature>"], checked by the
# workflow that builds it (`check-coverage.py --feature <crate>/<feature>`). The
# two measure different code and are not combined: each floor is the share of
# its own build's lines under src/ that that build's tests run. No crate here
# has one today: the call engine's, district-call's `livekit`, is held in
# District AI core for Rust with the crate.
#
# Only this workspace's crates are measured. The core's crates (district-model,
# -api, -auth, -live, -core, -host and -call) are dependencies here, pinned by
# tag, and their own repository holds them to their floors (100, and 97 for the
# call engine's build).

[crates.district-desktop]
floor = 100
reason = "Measured, not a target: the Secret Service and XDG portal calls need a desktop session CI does not have."

[crates.district-app]
floor = 98
reason = "Measured, not a target: the smoke test drives the real window under Xvfb, but the start-up wiring (the keyring, the network, the runtime, logind's sleep signal) and the runner's thread run only in the real app."
