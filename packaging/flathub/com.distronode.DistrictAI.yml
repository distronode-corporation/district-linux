# District AI for Linux as Flathub builds it. WRITTEN BY
# scripts/flathub-manifest.py FROM packaging/flatpak/com.distronode.DistrictAI.yml,
# so do not edit it: edit that one, run the script, and commit both. CI's `repo`
# job runs it with --check.
#
# It is that manifest with one change: the app's source is this repository at
# the release's tag, named by URL, tag and commit as Flathub requires, instead
# of the checkout the manifest sits in. Flathub's repository keeps this file
# beside flathub.json (x86_64 only, because the prebuilt libwebrtc is) and
# cargo-sources.json. "Flathub" in CONTRIBUTING.md has the submission.
#
# NOTICE applies as it does to a release: no build with calls may be
# distributed until libwebrtc's licensing has been reviewed, and publishing on
# Flathub is distributing.
id: com.distronode.DistrictAI
runtime: org.gnome.Platform
# GNOME 51, on the freedesktop SDK 26.08, whose GTK and libadwaita are well
# above the app's floor of 4.14 and 1.5.
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # clang. The SDK has LLVM's libraries but no clang++ to run, and webrtc-sys
  # compiles against the libc++ inside libwebrtc, which only clang 21.1 or
  # newer may do (its build checks, and refuses GCC). This is LLVM 22.1.
  - org.freedesktop.Sdk.Extension.llvm22
command: district-ai
finish-args:
  # The District AI service, its live updates socket and a call's media.
  - --share=network
  # Shared memory with the X server, which GTK needs under X11 and XWayland.
  - --share=ipc
  - --socket=wayland
  # X11 only where there is no Wayland.
  - --socket=fallback-x11
  # The GPU, for GTK's renderer.
  - --device=dri
  # A call's microphone and speakers (libwebrtc's audio module talks
  # PulseAudio, which pipewire-pulse serves on most desktops) and the ringtone
  # (GTK's GStreamer backend plays it through the same server).
  - --socket=pulseaudio
  # logind on the system bus: the app holds a delay inhibitor and listens for
  # PrepareForSleep, so a machine going to sleep stops ringing and ends a call
  # at once instead of leaving its registration to lapse. It needs nothing else
  # from the system bus.
  - --system-talk-name=org.freedesktop.login1
  # Nothing else. The keyring is the Secret portal (oo7 keeps an encrypted
  # file whose key the portal gives it), notifications, links, the file
  # chooser and autostart are portals too, and the app owns its own D-Bus name
  # without asking.
modules:
  - name: district-ai
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        # Where cargo-sources.json puts the crates and the configuration that
        # makes Cargo read them instead of the network.
        CARGO_HOME: /run/build/district-ai/cargo
        CARGO_NET_OFFLINE: "true"
        # The llvm22 extension's, for webrtc-sys (see sdk-extensions).
        CXX: clang++
    build-commands:
      - clang++ --version
      - cargo --version
      - |
        set -eu
        webrtc="$(bash scripts/fetch-libwebrtc.sh "$PWD/libwebrtc")"
        LK_CUSTOM_WEBRTC="$webrtc" cargo build --release --locked --offline \
          -p district-app --features voice
        install -Dm755 target/release/district-ai -t "$FLATPAK_DEST/bin"
        data=crates/district-app/data
        install -Dm644 "$data/$FLATPAK_ID.desktop" -t "$FLATPAK_DEST/share/applications"
        install -Dm644 "$data/$FLATPAK_ID.metainfo.xml" -t "$FLATPAK_DEST/share/metainfo"
        install -Dm644 "$data/icons/hicolor/scalable/apps/$FLATPAK_ID.svg" \
          -t "$FLATPAK_DEST/share/icons/hicolor/scalable/apps"
        install -Dm644 "$data/icons/hicolor/symbolic/apps/$FLATPAK_ID-symbolic.svg" \
          -t "$FLATPAK_DEST/share/icons/hicolor/symbolic/apps"
        # The D-Bus service from its template, naming this package's binary.
        # Flatpak rewrites the exported copy to start it inside the sandbox.
        mkdir -p "$FLATPAK_DEST/share/dbus-1/services"
        sed "s|@bindir@|$FLATPAK_DEST/bin|" "$data/$FLATPAK_ID.service.in" \
          > "$FLATPAK_DEST/share/dbus-1/services/$FLATPAK_ID.service"
        # The licence and NOTICE, and libwebrtc's licence texts, which NOTICE
        # says must travel with a build that links it.
        licences="$FLATPAK_DEST/share/licenses/$FLATPAK_ID"
        install -Dm644 LICENSE NOTICE -t "$licences"
        install -Dm644 "$webrtc/LICENSE.md" "$licences/libwebrtc-LICENSE.md"
    sources:
      # This repository at the release's tag. Flathub asks for the commit the
      # tag names beside it, which this file cannot know, since a commit cannot
      # name itself: `scripts/flathub-manifest.py --submission` fills it in
      # from the tag.
      - type: git
        url: https://github.com/distronode-corporation/district-linux.git
        tag: v0.1.0
        commit: FILLED-IN-BY-FLATHUB-MANIFEST-SUBMISSION
      - cargo-sources.json
      # The pin in scripts/fetch-libwebrtc.sh. Moving it moves both.
      - type: file
        url: https://github.com/livekit/rust-sdks/releases/download/webrtc-89d790b/webrtc-linux-x64-release.zip
        sha256: b167adad5291cea0e4d66a0454d9d52d2ad714e6b0ed70f4410317d3ebde70c5
        dest: libwebrtc
