# REUSE metadata (https://reuse.software) for files that cannot carry a comment header:
# JSON, Markdown, images, the icons and ringtone, Cargo.lock and NOTICE; tools/l10n/ (pinned by its SHA256SUMS); the two check scripts kept byte for byte equal to the Rust core's copies (scripts/check-pins.py compares them); the l10n catalogs, which l10n.py requires in canonical form; the files scripts/gen-l10n.py and l10n.py generate, and their .in templates; and the cargo-about template, whose output a comment would change. Every other file carries its own SPDX header,
# and `reuse lint` in CI fails when one is missing.
version = 1

[[annotations]]
path = [
  "**/*.json",
  "**/*.md",
  "**/*.png",
  "**/*.svg",
  "**/*.wav",
  "**/*.txt",
  "Cargo.lock",
  "NOTICE",
  "tools/l10n/**",
  "scripts/check-public-hygiene.py",
  "scripts/check-coverage.py",
  "crates/district-app/l10n/**",
  "crates/district-app/po/**",
  "crates/district-app/src/l10n/text.rs",
  "crates/district-app/tests/generated/**",
  "crates/district-app/data/*.in",
  "crates/district-app/data/com.distronode.DistrictAI.desktop",
  "crates/district-app/data/com.distronode.DistrictAI.metainfo.xml",
  "about.hbs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Distronode Corporation"
SPDX-License-Identifier = "Apache-2.0"
