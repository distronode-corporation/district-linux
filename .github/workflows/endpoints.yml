name: Endpoints

# A weekly re-check of contracts/endpoints.snapshot.json against the Android app,
# the reference client this one mirrors. The snapshot is committed and nothing
# else regenerates it, so without this an endpoint the Android app gains, loses or
# moves would leave crates/district-api/tests/endpoint_parity.rs green against old
# data until someone happened to re-run the sync.
#
# district-android is public, so the checkout needs no credential beyond the
# job's own read-only token. The check reads the Android app's main branch and
# compares only the endpoint list, not the commit it came from. A red run means
# the snapshot is stale: refresh it with
# `python3 scripts/sync-endpoints.py --android <checkout>` (CONTRIBUTING.md, "The
# endpoint table") and change the endpoint table with it.
#
# Alerting is the run status and nothing else, as in audit.yml. GitHub disables
# a scheduled workflow in a public repository after 60 days without repository
# activity; re-enable it from the Actions tab.
on:
  schedule:
    # Weekly, Monday, after scorecard.yml ('17 6 * * 1'), voice.yml
    # ('23 6 * * 1') and audit.yml ('47 6 * * 1').
    - cron: '7 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/endpoints.snapshot.json"
      - "scripts/sync-endpoints.py"
      - "scripts/_common.py"
      - ".github/workflows/endpoints.yml"

permissions:
  contents: read

concurrency:
  group: endpoints-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: distronode-corporation/district-android
          path: district-android
          persist-credentials: false

      # The script refuses a checkout whose sources differ from its commit, so a
      # fresh one is what it reads.
      - name: The endpoint snapshot is current with the Android app
        run: python3 scripts/sync-endpoints.py --android district-android --check
