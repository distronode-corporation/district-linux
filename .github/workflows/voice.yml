name: Voice

# The app with calls: the app's `voice` feature, which turns on the LiveKit call
# engine (district-call's `livekit`, in District AI core for Rust). It links
# libwebrtc, a prebuilt static library, so the default jobs in ci.yml never
# build it and never download it; this workflow is where the app is linted and
# built with it, against the archive scripts/fetch-libwebrtc.sh pins, and where
# the built binary is run to show it says it has calls.
#
# The engine itself, with its tests against a real `livekit-server` and its
# coverage floor, moved to District AI core for Rust with the crate, and its
# voice.yml runs them on the same archive (scripts/check-pins.py holds the two
# fetch scripts to the same pins).
#
# Started by hand with the id of a libwebrtc.yml run, it builds against that
# run's libwebrtc instead of the pinned archive, which is how a new build is
# shown to link with the app before it is published and pinned.
#
# Run by hand, weekly (a new libwebrtc or runner image shows up without a change
# here), and on changes to what a build with calls is made of: the core's pin
# (Cargo.toml and Cargo.lock), the app's manifest and the start-up wiring that
# picks the engine, libwebrtc's pin and the toolchain that compiles against it.
# The list is written once, under `pull_request`, and `push` reuses it with a
# YAML anchor, which GitHub Actions has accepted since September 2025.
on:
  workflow_dispatch:
    inputs:
      libwebrtc_run:
        description: "The id of a libwebrtc.yml run whose build to test; empty for the archive scripts/fetch-libwebrtc.sh pins"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths: &engine-paths
      - "crates/district-app/Cargo.toml"
      - "crates/district-app/src/startup.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/fetch-libwebrtc.sh"
      - ".github/actions/install-clang-21/**"
      - ".github/workflows/voice.yml"
  push:
    branches: [main]
    paths: *engine-paths

permissions:
  contents: read

concurrency:
  group: voice-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # actions: read, to download another run's artifact (libwebrtc_run).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustc --version

      # clang 21 from the LLVM project's apt repository, against a pinned key,
      # GTK 4 and libadwaita, and the headers webrtc-sys compiles against (the
      # action says why each).
      - uses: $/.github/actions/install-clang-21

      # The archive is checked against its pinned SHA-256 on every run, cached or
      # not, so the cache saves the download and vouches for nothing.
      - if: inputs.libwebrtc_run == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libwebrtc/webrtc-linux-x64-release.zip
          key: libwebrtc-${{ hashFiles('scripts/fetch-libwebrtc.sh') }}

      - name: Fetch and verify libwebrtc
        if: inputs.libwebrtc_run == ''
        run: |
          set -euo pipefail
          dir="$(scripts/fetch-libwebrtc.sh "$RUNNER_TEMP/libwebrtc")"
          echo "LK_CUSTOM_WEBRTC=$dir" >> "$GITHUB_ENV"

      # Or a libwebrtc.yml run's build, not yet published. A run id is a
      # number, and anything else is refused before it reaches the download.
      - name: Check the libwebrtc run id
        if: inputs.libwebrtc_run != ''
        env:
          RUN: ${{ inputs.libwebrtc_run }}
        run: |
          case "$RUN" in
            *[!0-9]*)
              echo "::error::libwebrtc_run must be a workflow run id (digits only), not '$RUN'"
              exit 1
              ;;
          esac

      - if: inputs.libwebrtc_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libwebrtc-linux-x64-release
          run-id: ${{ inputs.libwebrtc_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/libwebrtc-run

      # The digest travelled in the same artifact, so it catches a damaged
      # download and nothing more; what vouches for the build is that it is
      # this repository's own run.
      - name: Verify and unpack that libwebrtc
        if: inputs.libwebrtc_run != ''
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/libwebrtc-run"
          sha256sum --check webrtc-linux-x64-release.zip.sha256
          # A path of its own, not the pinned archive's, so that nothing a
          # restored cache built against that archive is taken for this one.
          mkdir -p "$RUNNER_TEMP/libwebrtc-built"
          unzip -q webrtc-linux-x64-release.zip -d "$RUNNER_TEMP/libwebrtc-built"
          chmod -R u+rwX "$RUNNER_TEMP/libwebrtc-built"
          echo "LK_CUSTOM_WEBRTC=$RUNNER_TEMP/libwebrtc-built/linux-x64-release" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: voice
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The app with `voice` (its smoke test included, so it is linted too).
      - name: cargo clippy with voice
        run: cargo clippy -p district-app --all-targets --locked --features district-app/voice,district-app/gtk-tests -- -D warnings

      # The binary with calls, linked against that libwebrtc, and run: its
      # --version touches no display, keyring or network, and says whether the
      # build has calls, which this one must.
      - name: cargo build with voice, and the binary says it has calls
        run: |
          set -euo pipefail
          cargo build -p district-app --locked --features voice
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          got="$(target/debug/district-ai --version)"
          want="district-ai $version (with calls)"
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::--version said \"$got\", not \"$want\""
            exit 1
          fi
