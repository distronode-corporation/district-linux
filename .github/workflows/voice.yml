name: Voice

# The LiveKit call engine: district-call's `livekit` feature, which the app's
# `voice` feature turns on. It links libwebrtc, a prebuilt static library, so the
# default jobs in ci.yml never build it and never download it; this workflow is
# where it is built, linted and tested, and where district-call's coverage with
# the feature is held to its floor ([features."district-call/livekit"] in
# coverage-floors.toml).
#
# The tests run the engine against a real `livekit-server` on the runner's
# loopback, two engines in one room: the tone one sends and the other hears,
# encryption with the same passphrase and with different ones, the people in the
# room, the microphone off and on, leaving, a server that goes and one that comes
# back, and what reaches stderr and a logger. The desktop's own audio path is
# tested against a private PulseAudio server with a null sink and a sine source,
# so nothing is heard and no real device is touched.
#
# Run by hand, weekly (a new libwebrtc or livekit-server behaviour shows up
# without a change here), and on changes to what the engine is made of. Minutes
# are metered while the repository is private, so it is one job, and its paths
# are the engine's.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - "crates/district-call/**"
      - "crates/district-core/src/media.rs"
      - "crates/district-app/Cargo.toml"
      - "crates/district-app/src/startup.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "coverage-floors.toml"
      - "scripts/check-coverage.py"
      - "scripts/fetch-libwebrtc.sh"
      - ".github/workflows/voice.yml"
  push:
    branches: [main]
    paths:
      - "crates/district-call/**"
      - "crates/district-core/src/media.rs"
      - "crates/district-app/Cargo.toml"
      - "crates/district-app/src/startup.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "coverage-floors.toml"
      - "scripts/check-coverage.py"
      - "scripts/fetch-libwebrtc.sh"
      - ".github/workflows/voice.yml"

permissions:
  contents: read

concurrency:
  group: voice-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c llvm-tools-preview
          rustc --version

      # clang 21, because the prebuilt libwebrtc is built against Chromium's own
      # libc++, which needs clang 21.1 or newer (webrtc-sys's build script checks,
      # and refuses GCC outright). Ubuntu 24.04 ships clang 18. LiveKit's own CI
      # downloads the whole LLVM release (2 GB); the LLVM project's apt
      # repository for this release has clang 21 alone, signed with the key
      # whose fingerprint is pinned here, and apt refuses anything it did not
      # sign.
      #
      # The rest: GTK 4 and libadwaita for the app; the headers webrtc-sys
      # compiles against (it loads the X11, DRM and VA libraries at run time and
      # links none of them); PulseAudio and its tools for the device test.
      - name: Install clang 21 and the system libraries
        env:
          LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/llvm.key" https://apt.llvm.org/llvm-snapshot.gpg.key
          have="$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.key" | awk -F: '/^fpr/ { print $10; exit }')"
          if [ "$have" != "$LLVM_KEY_FINGERPRINT" ]; then
            echo "::error::apt.llvm.org's key is $have, not the pinned $LLVM_KEY_FINGERPRINT"
            exit 1
          fi
          gpg --dearmor < "$RUNNER_TEMP/llvm.key" | sudo tee /usr/share/keyrings/llvm.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-21 \
            pkg-config libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev \
            libxcomposite-dev libgl1-mesa-dev libdrm-dev libgbm-dev libva-dev libpulse-dev \
            pulseaudio pulseaudio-utils
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
          clang++-21 --version

      # The archive is checked against its pinned SHA-256 on every run, cached or
      # not, so the cache saves the download and vouches for nothing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libwebrtc/webrtc-linux-x64-release.zip
          key: libwebrtc-${{ hashFiles('scripts/fetch-libwebrtc.sh') }}

      - name: Fetch and verify libwebrtc
        run: |
          set -euo pipefail
          dir="$(scripts/fetch-libwebrtc.sh "$RUNNER_TEMP/libwebrtc")"
          echo "LK_CUSTOM_WEBRTC=$dir" >> "$GITHUB_ENV"

      # The media server the tests start their own copies of. The upstream
      # release, checked against a pinned SHA-256.
      - name: Install livekit-server
        env:
          LIVEKIT_SERVER_VERSION: 1.13.7
          LIVEKIT_SERVER_SHA256: 6634aeeb2fb1366b6723708ae4320b9d5408106a4c63457c5e845ae3979c90e2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/livekit-server.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_SERVER_VERSION}/livekit_${LIVEKIT_SERVER_VERSION}_linux_amd64.tar.gz"
          echo "${LIVEKIT_SERVER_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/livekit"
          tar xzf "$archive" -C "$RUNNER_TEMP/livekit" livekit-server
          echo "LIVEKIT_SERVER=$RUNNER_TEMP/livekit/livekit-server" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/livekit/livekit-server" --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: voice
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The same install as ci.yml's: the upstream release against a pinned
      # SHA-256. A bump changes both files.
      - name: Install cargo-llvm-cov
        env:
          CARGO_LLVM_COV_VERSION: 0.9.1
          CARGO_LLVM_COV_SHA256: 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522
        run: |
          set -euo pipefail
          name="cargo-llvm-cov-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/llvm-cov.tgz" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/${name}.tar.gz"
          echo "${CARGO_LLVM_COV_SHA256}  $RUNNER_TEMP/llvm-cov.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/llvm-cov.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-llvm-cov" "$HOME/.cargo/bin/cargo-llvm-cov"
          cargo llvm-cov --version

      # The app with `voice` (its smoke test included, so it is linted too) and
      # the engine's own tests.
      - name: cargo clippy with voice
        run: cargo clippy -p district-call -p district-app --all-targets --locked --features district-app/voice,district-app/gtk-tests -- -D warnings

      # One test at a time: each starts its own media server and measures real
      # time audio, and four cores shared by several calls would measure the
      # runner rather than the engine.
      - name: cargo test with the LiveKit engine, measuring line coverage
        run: |
          set -euo pipefail
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/llvm-cov.env"
          # shellcheck source=/dev/null # generated by the line above
          . "$RUNNER_TEMP/llvm-cov.env"
          cargo llvm-cov clean --workspace
          cargo test -p district-call --features livekit --locked -- --test-threads=1 --nocapture
          cargo llvm-cov report --show-missing-lines
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/coverage.json"

      - name: Line coverage meets the LiveKit engine's floor
        run: python3 scripts/check-coverage.py --feature district-call/livekit "$RUNNER_TEMP/coverage.json"
