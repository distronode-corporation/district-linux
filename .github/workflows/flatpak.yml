name: Flatpak

# Builds District AI for Linux as a Flatpak bundle, with calls, from
# packaging/flatpak/com.distronode.DistrictAI.yml, installs the bundle and runs
# the built app's --version inside the sandbox. While the licence gate is open
# (LIBWEBRTC_LICENCE_CLEARED), the bundle is also kept for a week as this run's
# artifact, and so is the binary's debug file, which the bundle does not hold;
# release.yml calls it to build the release's bundle, and uploads that debug
# file to Sentry.
#
# Crash reports: only a release (release.yml, on a `v` tag) builds with the
# DSN, the LINUX_SENTRY_DSN secret it passes in, so only a release's binary can
# send a report, and only once its user has said yes. Every other run builds
# without one, which reports nothing and never asks
# (crates/district-app/src/crash.rs).
#
# Run by hand, from release.yml, and on pull requests that change what the
# Flatpak is built from (the manifest and cargo-sources.json, which moves with
# every Cargo.lock change, the files the manifest installs or runs, and what
# THIRD-PARTY-LICENSES.txt is written from).
# Minutes are metered while the repository is private, and a build with
# calls is long, so it is one job and never runs on a push to main.
#
# `correlation` only names the run, so the release train can find the exact run it dispatched
# (GitHub's dispatch API returns no run id). No step reads it. Empty, a dispatch is named
# "Flatpak" and a pull request's run keeps the pull request's title, as before; a run
# release.yml calls is part of release.yml's run and takes its name.
run-name: ${{ inputs.correlation && format('{0} [{1}]', github.workflow, inputs.correlation) || github.event.pull_request.title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        description: Set by the release train to find this exact run (manifest, lane, step, time). Leave empty.
        type: string
        default: ""
  workflow_call:
    secrets:
      # Where a release's crash reports go. Not a credential (the binary
      # carries it for anyone to read), and given only by release.yml.
      LINUX_SENTRY_DSN:
        required: false
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "crates/district-app/data/com.distronode.DistrictAI.*"
      - "crates/district-app/data/icons/**"
      - "LICENSE"
      - "NOTICE"
      - "Cargo.lock"
      - "about.toml"
      - "about.hbs"
      - "scripts/fetch-libwebrtc.sh"
      - "scripts/third-party-licenses.sh"
      # The French catalog, and the switch that decides whether it ships.
      - "crates/district-app/po/**"
      - "scripts/french-enabled.py"
      # The catalog and the generator the desktop entry and metadata come from.
      - "crates/district-app/l10n/**"
      - "scripts/gen-l10n.py"
      - "tools/l10n/**"
      - ".github/actions/read-version/**"
      - ".github/actions/install-cargo-about/**"
      - ".github/workflows/flatpak.yml"

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Flathub's build image with the GNOME 51 Platform and SDK installed from
      # Flathub, the runtime the manifest names. Pinned by digest, because the
      # SDK in it compiles what a release ships and the tag moves twice a week.
      # To move it, read the digest of the tag's current index:
      #   curl -sI -H "Authorization: Bearer $(curl -s 'https://ghcr.io/token?scope=repository:flathub-infra/flatpak-github-actions:pull' | jq -r .token)" \
      #     -H 'Accept: application/vnd.oci.image.index.v1+json' \
      #     https://ghcr.io/v2/flathub-infra/flatpak-github-actions/manifests/gnome-51
      IMAGE: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      # True only for release.yml's run on a `v` tag, the one run that builds
      # a release's binary: the Build the bundle step below refuses such a run
      # whose DSN is not set.
      RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') && github.workflow_ref == format('{0}/.github/workflows/release.yml@{1}', github.repository, github.ref) }}
    steps:
      # ⛔ THE RUNNER'S DISK IS NOT BIG ENOUGH AS IT COMES. The image (about 6 GB
      # unpacked), the rust-stable and llvm22 extensions, the vendored crates,
      # libwebrtc and a release build with calls filled it, and the runner died
      # mid-build with "No space left on device" and no log. So the image runs
      # as a container this job starts itself, after deleting toolchains the
      # runner image carries and nothing here uses, rather than as the job's
      # `container:`, which starts before any step could make room.
      - name: Make room on the runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        uses: $/.github/actions/read-version

      # THIRD-PARTY-LICENSES.txt, the licence texts of every crate the binary
      # links, as the .deb ships them. cargo-about is not in the SDK and the
      # build is offline, so the file is written here, on the runner, before
      # the build, and the manifest installs it from
      # target/flatpak/THIRD-PARTY-LICENSES.txt. The crates are fetched with
      # --locked, each checked against the SHA-256 Cargo.lock records, and the
      # texts come from those sources; nothing is cached.
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - uses: $/.github/actions/install-cargo-about

      - name: Write THIRD-PARTY-LICENSES.txt
        run: |
          set -euo pipefail
          cargo fetch --locked
          scripts/third-party-licenses.sh target/flatpak/THIRD-PARTY-LICENSES.txt

      # Privileged: flatpak-builder builds, and flatpak runs, inside bubblewrap
      # sandboxes, which a default container may not create; the image's
      # documentation asks for this. The checkout is mounted at /src.
      - name: Start the build container
        run: |
          docker pull --quiet "$IMAGE"
          docker run --detach --name flatpak --privileged \
            --volume "$GITHUB_WORKSPACE:/src" --workdir /src "$IMAGE" sleep infinity
          df -h /

      # The SDK extensions the manifest names, from Flathub, each on the
      # branch the SDK's extension point gives it (as flatpak-builder resolves
      # it), and nothing else: the GNOME Platform and SDK are the image's own
      # and stay at the image's commits, which the digest above pins.
      #
      # Not flatpak-builder's --install-deps-from, which runs `flatpak update`
      # on every dependency the image already has before it installs the rest.
      # An update ends by moving the old deployment into /var/lib/flatpak/.removed
      # with rename(2), and on some runners overlayfs refuses to rename a
      # directory that comes from an image layer: "Invalid cross-device link"
      # (EXDEV), then a segfault, before anything is built. Installing a ref
      # the image does not have creates its directories in the container's
      # own layer, so nothing from the image is renamed.
      - name: Install the SDK extensions
        env:
          MANIFEST: packaging/flatpak/com.distronode.DistrictAI.yml
        run: |
          set -euo pipefail
          docker exec --env MANIFEST flatpak bash -euo pipefail -c \
            'flatpak-builder --show-manifest "$MANIFEST"' > "$RUNNER_TEMP/manifest.json"
          sdk="$(jq -er '.sdk' "$RUNNER_TEMP/manifest.json")"
          branch="$(jq -er '."runtime-version"' "$RUNNER_TEMP/manifest.json")"
          mapfile -t extensions < <(jq -er '."sdk-extensions"[]' "$RUNNER_TEMP/manifest.json")
          case "$sdk" in
            */*) echo "::error::the manifest's sdk ($sdk) names a branch, which this step does not read"; exit 1 ;;
          esac
          docker exec --env SDK_REF="$sdk//$branch" flatpak bash -euo pipefail -c \
            'flatpak info --system --show-metadata "$SDK_REF"' > "$RUNNER_TEMP/sdk-metadata"
          echo "::group::$sdk//$branch metadata"
          cat "$RUNNER_TEMP/sdk-metadata"
          # The file need not end in a newline, and ::endgroup:: must start one.
          echo
          echo "::endgroup::"
          if [ "${#extensions[@]}" -eq 0 ]; then
            echo "::error::read no sdk-extensions from the manifest"
            exit 1
          fi
          # The key flatpak-builder reads, with GLib's key file rules (spaces
          # around "=", a group given twice): version in [Extension NAME], or
          # in [Extension PARENT] with NAME's last part cut off, else the SDK's
          # own branch.
          mapfile -t refs < <(python3 - "$RUNNER_TEMP/sdk-metadata" "$sdk//$branch" "$branch" "${extensions[@]}" <<'PY'
          import configparser
          import sys

          path, sdk_ref, branch, *extensions = sys.argv[1:]
          metadata = configparser.ConfigParser(interpolation=None, strict=False)
          metadata.optionxform = str
          metadata.read(path, encoding="utf-8")
          for extension in extensions:
              for name in (extension, extension.rsplit(".", 1)[0]):
                  group = f"Extension {name}"
                  if metadata.has_section(group):
                      version = metadata.get(group, "version", fallback=branch)
                      print(f"[{group}] version={version}", file=sys.stderr)
                      print(f"runtime/{extension}/x86_64/{version}")
                      break
              else:
                  print(f"::error::{sdk_ref} has no extension point for {extension}", file=sys.stderr)
                  print("")
          PY
          )
          if [ "${#refs[@]}" -ne "${#extensions[@]}" ] || printf '%s\n' "${refs[@]}" | grep -qx ''; then
            echo "::error::could not resolve every SDK extension's branch"
            exit 1
          fi
          printf 'installing %s\n' "${refs[@]}"
          docker exec flatpak flatpak install --system --noninteractive flathub "${refs[@]}"
          docker exec --env SDK_REF="$sdk//$branch" flatpak bash -euo pipefail -c '
            flatpak info --system "$SDK_REF"
            flatpak list --system --runtime --columns=application,branch,active
          '

      # flatpak-builder itself, from the image, rather than the
      # flatpak-github-actions action, which is two commands of it: one less
      # third party holding code execution in the job that builds what users
      # install (and this repository's allowed-actions list does not name it).
      # It installs and updates nothing (no --install-deps-from): the step
      # above has put everything it needs in place. No cache: every crate and
      # libwebrtc are downloaded and checked against their pinned digests on
      # every run, and a release must never be built from a restored build
      # directory. No FUSE in a container, hence --disable-rofiles-fuse.
      #
      # The DSN only for release.yml's run on a `v` tag (release.yml passes
      # the secret; nothing else does; in a called workflow `github` is the
      # caller's), and the build its crash reports name: the commit's
      # first twelve characters, as release.yml names the Sentry release. Both
      # reach the build through the manifest's secret-env. A release run
      # without the DSN is refused rather than built, which would carry no
      # crash reports.
      - name: Build the bundle
        env:
          LINUX_SENTRY_DSN: ${{ startsWith(github.ref, 'refs/tags/v') && github.workflow_ref == format('{0}/.github/workflows/release.yml@{1}', github.repository, github.ref) && secrets.LINUX_SENTRY_DSN || '' }}
        run: |
          if [ "$RELEASING" = "true" ] && [ -z "$LINUX_SENTRY_DSN" ]; then
            echo "::error::the LINUX_SENTRY_DSN secret is not set: this release would carry no crash reports"
            exit 1
          fi
          export DISTRICT_AI_BUILD="${GITHUB_SHA::12}"
          docker exec --env LINUX_SENTRY_DSN --env DISTRICT_AI_BUILD flatpak bash -euo pipefail -c '
            flatpak-builder --version
            flatpak-builder --disable-rofiles-fuse --force-clean --arch=x86_64 \
              --state-dir=.flatpak-builder --repo=repo \
              flatpak_app packaging/flatpak/com.distronode.DistrictAI.yml
            flatpak build-bundle --arch=x86_64 \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              repo district-ai.flatpak com.distronode.DistrictAI
            ls -l district-ai.flatpak
          '
          df -h /

      # The bundle as a user installs it, beside the runtime it names (the
      # image's GNOME 51 Platform, installed system-wide, which is where this
      # installs too), and run in the sandbox with exactly the manifest's
      # permissions. --version touches no display, keyring or network, and says
      # whether the build has calls, which a release must. --no-deps and
      # --no-related: by default the install also updates the runtime the
      # bundle names, and its related refs, which fails the same way as the
      # build's updates did (see "Install the SDK extensions"), and would run
      # the app on another Platform commit than the one it was built against.
      - name: The installed bundle runs, with calls
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker exec --env VERSION flatpak bash -euo pipefail -c '
            flatpak install --system --noninteractive --no-deps --no-related --bundle district-ai.flatpak
            flatpak info --system com.distronode.DistrictAI
            flatpak info --system --show-permissions com.distronode.DistrictAI
            XDG_RUNTIME_DIR="$(mktemp -d)"
            export XDG_RUNTIME_DIR
            got="$(flatpak run --system com.distronode.DistrictAI --version)"
            want="district-ai $VERSION (with calls)"
            echo "$got"
            if [ "$got" != "$want" ]; then
              echo "::error::--version in the sandbox said \"$got\", not \"$want\""
              exit 1
            fi
          '

      # Every licence text the bundle must carry, where NOTICE says it is:
      # /app in the sandbox is files/ under the installed app's location. A
      # crate every build links must be listed, so an empty or truncated
      # THIRD-PARTY-LICENSES.txt fails.
      - name: The installed bundle holds the licence texts
        run: |
          docker exec flatpak bash -euo pipefail -c '
            app="$(flatpak info --system --show-location com.distronode.DistrictAI)"
            dir="$app/files/share/licenses/com.distronode.DistrictAI"
            ls -l "$dir"
            fail=0
            for file in LICENSE NOTICE libwebrtc-LICENSE.md THIRD-PARTY-LICENSES.txt; do
              if [ ! -s "$dir/$file" ]; then
                echo "::error::the bundle has no /app/share/licenses/com.distronode.DistrictAI/$file"
                fail=1
              fi
            done
            if ! grep -qE "^  gtk4 [0-9]" "$dir/THIRD-PARTY-LICENSES.txt"; then
              echo "::error::THIRD-PARTY-LICENSES.txt does not list gtk4"
              fail=1
            fi
            exit "$fail"
          '

      # The release guard (release.yml runs this workflow): French ships only
      # with the `fr-ca` feature on. With it off the installed bundle holds no
      # catalog at all, with it on exactly the French one, in the app itself.
      - name: The installed bundle holds a French catalog only with French on
        run: |
          set -euo pipefail
          if python3 scripts/french-enabled.py; then french=on; else french=off; fi
          docker exec --env french="$french" flatpak bash -euo pipefail -c '
            app="$(flatpak info --system --show-location com.distronode.DistrictAI)"
            catalogs="$(cd "$app/files" && find . -name "*.mo" | sort)"
            want=""
            if [ "$french" = on ]; then
              want="./share/locale/fr/LC_MESSAGES/district-ai.mo"
            fi
            if [ "$catalogs" != "$want" ]; then
              echo "::error::French is $french, and the bundle holds these catalogs: ${catalogs:-none}"
              exit 1
            fi
            # The desktop entry and the metadata carry French exactly when the
            # catalog does.
            french_metadata=0
            for found in \
              "$(grep -c "xml:lang=\"fr\"" "$app/files/share/metainfo/com.distronode.DistrictAI.metainfo.xml" || true)" \
              "$(grep -c "^[A-Za-z]*\[fr\]=" "$app/files/share/applications/com.distronode.DistrictAI.desktop" || true)"; do
              if [ "$found" -gt 0 ]; then french_metadata=$((french_metadata + 1)); fi
            done
            if { [ "$french" = on ] && [ "$french_metadata" -ne 2 ]; } \
              || { [ "$french" = off ] && [ "$french_metadata" -ne 0 ]; }; then
              echo "::error::French is $french, and the desktop entry and metadata disagree ($french_metadata of 2 hold French)"
              exit 1
            fi
            if flatpak info --system com.distronode.DistrictAI.Locale > /dev/null 2>&1; then
              echo "::error::a separate com.distronode.DistrictAI.Locale extension is installed"
              exit 1
            fi
            echo "French is $french: catalogs ${catalogs:-none}"
          '

      - name: Name the bundle for the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p staging
          cp district-ai.flatpak "staging/district-ai_${VERSION}_x86_64.flatpak"
          ls -l staging

      # The debug file flatpak-builder split off the binary, which it keeps in
      # the build directory and leaves out of the bundle, for release.yml to
      # upload to Sentry: its build ID must be the installed binary's, or no
      # crash report from this bundle could be matched to it, and the binary
      # in the bundle must hold no debug information or symbol table.
      - name: Stage the debug file
        run: |
          set -euo pipefail
          found="$(find flatpak_app/files/lib/debug -type f -name district-ai.debug)"
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one district-ai.debug under flatpak_app/files/lib/debug, found: ${found:-none}"
            exit 1
          fi
          mkdir -p debug-files/flatpak
          cp "$found" debug-files/flatpak/district-ai.debug
          docker exec flatpak bash -euo pipefail -c '
            app="$(flatpak info --system --show-location com.distronode.DistrictAI)"
            cp "$app/files/bin/district-ai" /src/installed-district-ai
          '
          installed="$(readelf --notes installed-district-ai | awk '/Build ID:/ { print $3 }')"
          debug="$(readelf --notes debug-files/flatpak/district-ai.debug 2>/dev/null | awk '/Build ID:/ { print $3 }')"
          echo "installed binary $installed, debug file $debug"
          if [ -z "$installed" ] || [ "$installed" != "$debug" ]; then
            echo "::error::the debug file's build ID ($debug) is not the installed binary's ($installed)"
            exit 1
          fi
          # Each section's whole name: without --wide, readelf cuts a long
          # name short ("[...]"), which no pattern can then match.
          section_names() {
            readelf --wide --sections "$1" 2>/dev/null |
              awk '/^ *\[ *[0-9]+\]/ { sub(/^ *\[ *[0-9]+\] +/, ""); print $1 }'
          }
          installed_sections="$(section_names installed-district-ai)"
          debug_sections="$(section_names debug-files/flatpak/district-ai.debug)"
          if [ -z "$installed_sections" ] || [ -z "$debug_sections" ]; then
            echo "::error::readelf listed no sections in the installed binary or the debug file"
            exit 1
          fi
          # flatpak-builder compresses the debug sections before it splits
          # them off, the GNU way, which renames each .debug_X to .zdebug_X
          # (sentry-cli reads either), so both names count. .debug_gdb_scripts
          # is not debug information: rustc puts it in an allocated section
          # (it tells GDB which pretty printers to load), so stripping keeps it.
          left="$(printf '%s\n' "$installed_sections" |
            grep -E '^\.(z?debug_[a-z_]+|symtab)$' | grep -vx '\.debug_gdb_scripts' || true)"
          if [ -n "$left" ]; then
            echo "::error::the binary in the bundle still holds debug sections or a symbol table: $(printf '%s' "$left" | tr '\n' ' ')"
            exit 1
          fi
          if ! printf '%s\n' "$debug_sections" | grep -qE '^\.z?debug_line$'; then
            echo "::error::the debug file holds no line tables"
            exit 1
          fi
          ls -l debug-files/flatpak

      # ⛔ ONLY WHILE THE LICENCE GATE IS OPEN: an artifact of a public
      # repository can be downloaded by anyone. See deb.yml.
      - if: vars.LIBWEBRTC_LICENCE_CLEARED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: district-ai-flatpak
          path: staging/
          if-no-files-found: error
          retention-days: 7
          # Already compressed.
          compression-level: 0

      # Not named district-ai-*, which release.yml's publish job takes as the
      # release's assets.
      - if: vars.LIBWEBRTC_LICENCE_CLEARED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-files-flatpak
          path: debug-files/
          if-no-files-found: error
          retention-days: 7
