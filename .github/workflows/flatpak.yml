name: Flatpak

# Builds District AI for Linux as a Flatpak bundle, with calls, from
# packaging/flatpak/com.distronode.DistrictAI.yml, installs the bundle and runs
# the built app's --version inside the sandbox. While the licence gate is open
# (LIBWEBRTC_LICENCE_CLEARED), the bundle is also kept for a week as this run's
# artifact; release.yml calls it to build the release's bundle.
#
# Run by hand, from release.yml, and on pull requests that change what the
# Flatpak is built from (the manifest and cargo-sources.json, which moves with
# every Cargo.lock change, the files the manifest installs or runs, and what
# THIRD-PARTY-LICENSES.txt is written from).
# Minutes are metered while the repository is private, and a build with
# calls is long, so it is one job and never runs on a push to main.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "crates/district-app/data/com.distronode.DistrictAI.*"
      - "crates/district-app/data/icons/**"
      - "LICENSE"
      - "NOTICE"
      - "Cargo.lock"
      - "about.toml"
      - "about.hbs"
      - "scripts/fetch-libwebrtc.sh"
      - "scripts/third-party-licenses.sh"
      - ".github/actions/read-version/**"
      - ".github/actions/install-cargo-about/**"
      - ".github/workflows/flatpak.yml"

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Flathub's build image with the GNOME 51 Platform and SDK installed from
      # Flathub, the runtime the manifest names. Pinned by digest, because the
      # SDK in it compiles what a release ships and the tag moves twice a week.
      # To move it, read the digest of the tag's current index:
      #   curl -sI -H "Authorization: Bearer $(curl -s 'https://ghcr.io/token?scope=repository:flathub-infra/flatpak-github-actions:pull' | jq -r .token)" \
      #     -H 'Accept: application/vnd.oci.image.index.v1+json' \
      #     https://ghcr.io/v2/flathub-infra/flatpak-github-actions/manifests/gnome-51
      IMAGE: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
    steps:
      # ⛔ THE RUNNER'S DISK IS NOT BIG ENOUGH AS IT COMES. The image (about 6 GB
      # unpacked), the rust-stable and llvm22 extensions, the vendored crates,
      # libwebrtc and a release build with calls filled it, and the runner died
      # mid-build with "No space left on device" and no log. So the image runs
      # as a container this job starts itself, after deleting toolchains the
      # runner image carries and nothing here uses, rather than as the job's
      # `container:`, which starts before any step could make room.
      - name: Make room on the runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        uses: $/.github/actions/read-version

      # THIRD-PARTY-LICENSES.txt, the licence texts of every crate the binary
      # links, as the .deb ships them. cargo-about is not in the SDK and the
      # build is offline, so the file is written here, on the runner, before
      # the build, and the manifest installs it from
      # target/flatpak/THIRD-PARTY-LICENSES.txt. The crates are fetched with
      # --locked, each checked against the SHA-256 Cargo.lock records, and the
      # texts come from those sources; nothing is cached.
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - uses: $/.github/actions/install-cargo-about

      - name: Write THIRD-PARTY-LICENSES.txt
        run: |
          set -euo pipefail
          cargo fetch --locked
          scripts/third-party-licenses.sh target/flatpak/THIRD-PARTY-LICENSES.txt

      # Privileged: flatpak-builder builds, and flatpak runs, inside bubblewrap
      # sandboxes, which a default container may not create; the image's
      # documentation asks for this. The checkout is mounted at /src.
      - name: Start the build container
        run: |
          docker pull --quiet "$IMAGE"
          docker run --detach --name flatpak --privileged \
            --volume "$GITHUB_WORKSPACE:/src" --workdir /src "$IMAGE" sleep infinity
          df -h /

      # flatpak-builder itself, from the image, rather than the
      # flatpak-github-actions action, which is two commands of it: one less
      # third party holding code execution in the job that builds what users
      # install (and this repository's allowed-actions list does not name it).
      # The SDK extensions come from Flathub at build time
      # (--install-deps-from). No cache: every crate and libwebrtc are
      # downloaded and checked against their pinned digests on every run, and a
      # release must never be built from a restored build directory. No FUSE in
      # a container, hence --disable-rofiles-fuse.
      - name: Build the bundle
        run: |
          docker exec flatpak bash -euo pipefail -c '
            flatpak-builder --version
            flatpak-builder --disable-rofiles-fuse --force-clean \
              --install-deps-from=flathub --arch=x86_64 \
              --state-dir=.flatpak-builder --repo=repo \
              flatpak_app packaging/flatpak/com.distronode.DistrictAI.yml
            flatpak build-bundle --arch=x86_64 \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              repo district-ai.flatpak com.distronode.DistrictAI
            ls -l district-ai.flatpak
          '
          df -h /

      # The bundle as a user installs it, beside the runtime it names (the
      # image's GNOME 51 Platform, installed system-wide, which is where this
      # installs too), and run in the sandbox with exactly the manifest's
      # permissions. --version touches no display, keyring or network, and says
      # whether the build has calls, which a release must.
      - name: The installed bundle runs, with calls
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker exec --env VERSION flatpak bash -euo pipefail -c '
            flatpak install --system --noninteractive --bundle district-ai.flatpak
            flatpak info --system com.distronode.DistrictAI
            flatpak info --system --show-permissions com.distronode.DistrictAI
            XDG_RUNTIME_DIR="$(mktemp -d)"
            export XDG_RUNTIME_DIR
            got="$(flatpak run --system com.distronode.DistrictAI --version)"
            want="district-ai $VERSION (with calls)"
            echo "$got"
            if [ "$got" != "$want" ]; then
              echo "::error::--version in the sandbox said \"$got\", not \"$want\""
              exit 1
            fi
          '

      # Every licence text the bundle must carry, where NOTICE says it is:
      # /app in the sandbox is files/ under the installed app's location. A
      # crate every build links must be listed, so an empty or truncated
      # THIRD-PARTY-LICENSES.txt fails.
      - name: The installed bundle holds the licence texts
        run: |
          docker exec flatpak bash -euo pipefail -c '
            app="$(flatpak info --system --show-location com.distronode.DistrictAI)"
            dir="$app/files/share/licenses/com.distronode.DistrictAI"
            ls -l "$dir"
            fail=0
            for file in LICENSE NOTICE libwebrtc-LICENSE.md THIRD-PARTY-LICENSES.txt; do
              if [ ! -s "$dir/$file" ]; then
                echo "::error::the bundle has no /app/share/licenses/com.distronode.DistrictAI/$file"
                fail=1
              fi
            done
            if ! grep -qE "^  gtk4 [0-9]" "$dir/THIRD-PARTY-LICENSES.txt"; then
              echo "::error::THIRD-PARTY-LICENSES.txt does not list gtk4"
              fail=1
            fi
            exit "$fail"
          '

      - name: Name the bundle for the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p staging
          cp district-ai.flatpak "staging/district-ai_${VERSION}_x86_64.flatpak"
          ls -l staging

      # ⛔ ONLY WHILE THE LICENCE GATE IS OPEN: an artifact of a public
      # repository can be downloaded by anyone. See deb.yml.
      - if: vars.LIBWEBRTC_LICENCE_CLEARED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: district-ai-flatpak
          path: staging/
          if-no-files-found: error
          retention-days: 7
          # Already compressed.
          compression-level: 0
