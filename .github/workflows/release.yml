name: Release

# Fires on a `vX.Y.Z` tag and publishes the two packages a user installs: the
# .deb (Ubuntu 24.04, Debian 13 and newer) and the Flatpak bundle, both x86_64
# and both built with calls. A third file, `district-ai_<version>.intoto.jsonl`,
# is the signed provenance attestation over both, attached so it can be
# verified offline and found by OpenSSF Scorecard.
#
# Three stages, and only the last can write anything:
#
# - `guard` refuses a tag that should not be built: one on a commit that is not
#   on main (CI never tested it), one that the versions in Cargo.toml,
#   CHANGELOG.md and the AppStream metadata do not all name, one without a
#   CHANGELOG.md section to make the notes from, or a tree without the contract
#   snapshot the app was tested against.
# - `deb` and `flatpak` build the packages with deb.yml and flatpak.yml, the
#   workflows pull requests run, read-only, with no caches and from the
#   committed Cargo.lock, and test them (the .deb installed on each supported
#   distribution, the bundle run in its sandbox).
# - `publish` refuses unless libwebrtc's licensing has been cleared (below),
#   then attests the packages' provenance, verifies the attestations, creates a
#   DRAFT release with the notes from CHANGELOG.md, checks that GitHub holds
#   exactly the two packages and the provenance bundle, and only then makes the
#   release public.
#
# ⛔ THE LICENCE GATE. A build with calls statically links libwebrtc, so
# publishing it distributes the libwebrtc the pin names. The repository
# variable LIBWEBRTC_LICENCE_CLEARED says whether that libwebrtc has been
# reviewed and cleared; unless it is exactly `true`, `publish` fails before it
# touches anything, and deb.yml and flatpak.yml keep no artifact (in a public
# repository an artifact is a download anyone can take). It is `true` for this
# project's own build without the H.264 and H.265 codecs or FFmpeg
# (CONTRIBUTING.md, "The licence gate"); a new pin sets it back to `false`
# until that build is reviewed.
#
# Artifact attestations need the repository to be public (or GitHub Enterprise
# Cloud); in a private repository `publish` fails at the attestation.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never cancel a release in flight: a cancelled publish can leave a draft with
# only some of its assets, which the next run then has to clean up.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      # The whole history and every branch, for the ancestry check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ⛔ A TAG IS NOT A BRANCH, AND CI DOES NOT RUN ON ONE. ci.yml runs on
      # pushes to main and on pull requests, so a tag on a commit that never
      # reached main (a local branch, an abandoned pull request, a detached HEAD)
      # would be built, attested and released without a test having run on it.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::the checkout has no origin/main to compare the tag with"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            echo "CI never ran on this commit. Merge it to main first, then move the tag."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      # Cargo.toml, CHANGELOG.md and the metainfo's newest release all name the
      # tag's version, the CHANGELOG.md section exists and is dated, and the
      # metainfo calls it a stable release of that date.
      - name: Versions agree with the tag
        run: python3 scripts/check-version.py "$GITHUB_REF_NAME"

      # District AI core for Rust, which the app is built on: one tag for all
      # seven crates, Cargo.lock at the commit that tag names on GitHub now,
      # the Flatpak's sources at that commit, and the copied scripts matching
      # the core's. A release built while the tag and the lock file disagreed
      # would ship a core nobody can find again by its tag.
      - name: The core's pin agrees with Cargo.lock and with its tag
        run: python3 scripts/check-pins.py

      - name: Expose the bare version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag's section of CHANGELOG.md, so the release notes and the
      # changelog cannot drift. Index-based rather than a `\[` regex so it is
      # portable across awk flavours; it stops at the next heading or at the
      # link definitions at the end.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## [${version}]" '
            index($0, tag)==1 {cap=1; next}
            index($0, "## [")==1 && cap==1 {cap=0}
            substr($0,1,1)=="[" && cap==1 {exit}
            cap {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md's section for $version is empty"
            exit 1
          fi
          # A random delimiter, so no line of the changelog can end the value
          # early.
          delim="body_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat release-notes.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  # ⛔ READ-ONLY, DELIBERATELY. These run `cargo build`, which executes every
  # build script in the dependency tree, so they hold no write permission and
  # no token that could create a release; they only upload this run's
  # artifacts, and only while the licence gate is open.
  deb:
    needs: guard
    permissions:
      contents: read
    uses: $/.github/workflows/deb.yml

  flatpak:
    needs: guard
    permissions:
      contents: read
    uses: $/.github/workflows/flatpak.yml

  # The only job that can write to the repository and the only one that can
  # make a release public. It sees packages, never source, and runs no build.
  publish:
    needs: [guard, deb, flatpak]
    # The `release` environment admits only `v*` tags, so this job, the one
    # that can write, cannot run for anything else whatever starts the workflow.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Both only for the provenance attestation: id-token to obtain the OIDC
      # token Sigstore signs against, attestations to store the result.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job never checks out the repository, and `gh release` resolves its
      # repository from the working directory's git remote unless told.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      # First, before anything is downloaded, attested or created.
      - name: libwebrtc's licensing has been cleared for distribution
        env:
          CLEARED: ${{ vars.LIBWEBRTC_LICENCE_CLEARED }}
        run: |
          if [ "$CLEARED" != "true" ]; then
            echo "::error::Refusing to publish: the repository variable LIBWEBRTC_LICENCE_CLEARED is '${CLEARED}', not 'true'."
            echo "These packages statically link libwebrtc, so publishing them distributes the libwebrtc scripts/fetch-libwebrtc.sh pins."
            echo "The variable says that libwebrtc has been reviewed and cleared; set it to true only once it has (CONTRIBUTING.md, \"The licence gate\")."
            echo "The packages this run built and tested were not kept."
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: district-ai-*
          merge-multiple: true
          path: assets

      # ⛔ BY NAME, NOT BY COUNT. A tree whose version drifted from the tag, or a
      # package built for the wrong architecture, still makes two files. These
      # are the names README.md tells users to download. The list is written
      # once here and re-read, with the provenance bundle added, by the check
      # against GitHub below.
      - name: The two release assets are exactly what was expected
        run: |
          set -euo pipefail
          printf '%s\n' \
            "district-ai_${VERSION}-1_amd64.deb" \
            "district-ai_${VERSION}_x86_64.flatpak" | sort > "$RUNNER_TEMP/expected-assets.txt"
          expected="$(cat "$RUNNER_TEMP/expected-assets.txt")"
          actual="$(cd assets && find . -type f -printf '%f\n' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the built assets are not the two names a release must carry"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          printf '%s\n' "$actual"

      # Signed provenance over the bytes a user downloads, verifiable with:
      #   gh attestation verify district-ai_0.1.0-1_amd64.deb --repo distronode-corporation/district-linux
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      # The attestation is ONE Sigstore bundle whose subjects are both packages
      # (the action's `bundle-path`, one JSON line). It is attached to the
      # release as `district-ai_<version>.intoto.jsonl`, so a user can verify
      # offline with `gh attestation verify <package> --bundle <that file>
      # --repo ...`, and so OpenSSF Scorecard's Signed-Releases check finds
      # provenance on the release. It is kept out of assets/, which holds
      # exactly the two files the name check above asserted.
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE_PATH" ] || { echo "::error::the attestation step wrote no bundle"; exit 1; }
          mkdir -p provenance
          cp "$BUNDLE_PATH" "provenance/district-ai_${VERSION}.intoto.jsonl"
          echo "district-ai_${VERSION}.intoto.jsonl" >> "$RUNNER_TEMP/expected-assets.txt"
          sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"

      # README.md promises every asset carries an attestation, and this is where
      # that is tested, before anything is public.
      - name: The attestations verify
        run: |
          set -euo pipefail
          for f in assets/*; do
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; then
                # And against the file that will be attached, which is what a
                # user verifying offline will hold.
                gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                  --bundle "provenance/district-ai_${VERSION}.intoto.jsonl"
                continue 2
              fi
              echo "attestation for $(basename "$f") not queryable yet (attempt $attempt)"
              sleep 15
            done
            echo "::error::no verifiable attestation for $(basename "$f")"
            exit 1
          done

      # A draft first: invisible to users and to the releases API's `latest`, so
      # anything above or below can fail without a half-made release showing.
      - name: Create the draft release
        env:
          NOTES: ${{ needs.guard.outputs.body }}
        run: |
          set -euo pipefail
          # A leftover draft from a failed run is deleted and made again; a
          # release that is already public is never touched. `gh release delete`
          # leaves the tag alone.
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "deleting a leftover draft for $TAG"
              gh release delete "$TAG" --yes
            else
              echo "::error::$TAG is already published. Refusing to modify a public release."
              exit 1
            fi
          fi
          # The notes arrive through the environment, never interpolated into
          # this script: they are changelog text.
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "$TAG" --draft --verify-tag \
            --title "District AI for Linux $TAG" \
            --notes-file release-notes.md assets/* provenance/*

      # The same names again, against what GitHub stored, with the provenance
      # bundle added: the check above proves the files existed on this runner,
      # this one that each of the three uploads succeeded.
      - name: GitHub holds both packages and the provenance bundle
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/expected-assets.txt")"
          [ -n "$expected" ] || { echo "::error::the expected asset list is empty"; exit 1; }
          [ "$(printf '%s\n' "$expected" | wc -l)" -eq 3 ] || { echo "::error::the expected asset list does not name three files"; exit 1; }
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the draft does not hold the expected assets; leaving it as a draft"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest
