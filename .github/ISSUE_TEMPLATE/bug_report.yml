name: Bug report
description: Report a reproducible bug in District AI for Linux (not a question or a feature request).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/district-linux/issues?q=is%3Aissue).** It may already be reported or fixed.

        **Do not report a security vulnerability here.** Report it privately through [Report a vulnerability](https://github.com/distronode-corporation/district-linux/security/advisories/new) instead; see [SECURITY.md](https://github.com/distronode-corporation/district-linux/blob/main/SECURITY.md).

        **Nothing you paste here is private.** Leave out tokens, and leave out anything about the people your workspace talks to: names, phone numbers, transcripts, messages. Redact what you would not publish.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release or a build of `main`.
          required: true
        - label: This is not a security issue (those go to [Report a vulnerability](https://github.com/distronode-corporation/district-linux/security/advisories/new)).
          required: true
        - label: I've removed every token and every piece of customer or caller data from what I'm pasting.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the bug?
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, so a maintainer can reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version you installed (`district-ai --version`), or the commit you built from (`git rev-parse --short HEAD`).
      placeholder: district-ai 0.1.0 (with calls)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - .deb package
        - Flatpak bundle
        - Built from source
        - Other (say which in the description)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distribution, version and desktop
      placeholder: Ubuntu 24.04 with GNOME 46 on Wayland
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Anything the app printed when run from a terminal. Optional, but it often decides the issue. Read it before pasting.
      render: text
