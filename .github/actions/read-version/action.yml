name: Read the version
description: >-
  The workspace's version, [workspace.package] version in Cargo.toml, as the
  `version` output. deb.yml and flatpak.yml name and check their packages with it.

outputs:
  version:
    description: The version, for example 0.1.0
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read the version
      id: version
      shell: bash
      run: |
        version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "building $version"
