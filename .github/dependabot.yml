version: 2

# Two ecosystems, and one of them is easy to forget: the action SHAs. Every `uses:`
# in the workflows is pinned to a commit with a `# vX.Y.Z` comment, which is right
# for supply-chain safety and wrong for noticing a security fix, because a pinned
# SHA never moves on its own. `github-actions` here is what turns each pin into a
# pull request; Dependabot rewrites both the SHA and the version comment.
#
# `cargo` opens pull requests against Cargo.lock, which CI enforces with `--locked`,
# so a bump that does not build fails in its pull request rather than in someone's
# checkout. Each one also needs packaging/flatpak/cargo-sources.json written again
# from the new lock file (scripts/flatpak-cargo-sources.sh, pushed to the pull
# request's branch): CI's `repo` job fails until it is, and the Flatpak build then
# runs on the result.
#
# `cooldown` holds a version update back until the release is a week old, so a
# compromised publish that is yanked within days never reaches a pull request here.
# It does not delay security updates, which Dependabot opens as soon as an advisory
# lands.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One pull request for the routine bumps. A major version usually needs a
      # workflow edit, so it is deliberately left on its own.
      actions-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The gtk-rs crates release together and each one names the others' minor
      # versions, so bumping one alone leaves two copies of gtk4 or glib in the tree
      # and their types stop matching. Listed first because a dependency joins the
      # first group that matches it, and with no `update-types` so that the
      # breaking 0.x bumps land here too, as one pull request.
      gtk-rs:
        patterns:
          - gtk4
          - libadwaita
          - glib
          - gio
      # The LiveKit SDK's crates release together, and webrtc-sys-build names the
      # prebuilt libwebrtc that scripts/fetch-libwebrtc.sh is pinned to. A bump
      # that moves that libwebrtc fails voice.yml until the script's pin moves in
      # the same pull request, which is the point: see the script's header.
      livekit:
        patterns:
          - livekit
          - livekit-*
          - libwebrtc
          - webrtc-sys
          - webrtc-sys-build
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # District AI core for Rust, pinned by tag with the exact version beside
      # it. Moving it is a change to the app (CONTRIBUTING.md, "District AI core
      # for Rust"), made by hand with the version, the Flatpak's sources and
      # the copied scripts, never a tag bump alone.
      - dependency-name: "district-*"
      # These are the versions the rest of the tree already uses: sha2, hmac
      # and pbkdf2 through oo7, base64 through reqwest 0.12 (the LiveKit SDK's),
      # pbjson and wiremock. Moving only ours to the next generation compiles a
      # second copy of each (and of digest and its helpers), adds them to the
      # Flatpak's sources, and changes nothing the app does; patch releases
      # still come through. Lift an entry once the crates named here have moved.
      - dependency-name: sha2
        versions: [">= 0.11"]
      - dependency-name: hmac
        versions: [">= 0.13"]
      - dependency-name: pbkdf2
        versions: [">= 0.13"]
      - dependency-name: base64
        versions: [">= 0.23"]
