# actionlint's configuration, for running it by hand (CI runs zizmor, not
# actionlint):
#
#   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -no-color
paths:
  .github/workflows/release.yml:
    ignore:
      # release.yml calls deb.yml and flatpak.yml with GitHub's self-repository
      # syntax (`uses: $/...`, since July 2026: the calling workflow's own
      # repository at the commit that is running), which zizmor asks for and
      # actionlint 1.7.12, the newest release, predates. Only that message is
      # ignored, and only in this file.
      - 'reusable workflow call "\$/\.github/workflows/(deb|flatpak)\.yml" at "uses" is not following the format'
  .github/workflows/{audit,ci,deb,flatpak,voice}.yml:
    ignore:
      # The same syntax for this repository's own composite actions under
      # .github/actions/ (`uses: $/.github/actions/...`), which zizmor's
      # self-repository audit asks for and actionlint 1.7.12 reads as a remote
      # action without a ref.
      - 'specifying action "\$/\.github/actions/[a-z0-9-]+" in invalid format because ref is missing'
