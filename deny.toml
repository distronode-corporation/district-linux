# cargo-deny policy, run by the `cargo-deny` job in .github/workflows/ci.yml
# (`cargo deny --locked check`) and weekly, advisories only, by audit.yml.
# Four checks: RustSec advisories, licences, banned crates, allowed sources.

[graph]
# Only the target a release ships. Without this, crates that only ever build on
# Windows or macOS are judged too, including licences this project never
# distributes.
targets = ["x86_64-unknown-linux-gnu"]
# Optional features included, so the policy covers what `--features livekit`
# would ship, not just the default build.
all-features = true

[advisories]
# Unmaintained and unsound notices for the WHOLE tree, not only direct
# dependencies, so a new one anywhere is a decision rather than noise.
unmaintained = "all"
unsound = "all"
# Every vulnerability and unmaintained or unsound notice fails the check unless it
# is listed here with the reason it is tolerated and what would retire it. Remove an
# entry the day it can go.
ignore = [
  # zip 0.6.6: three extraction advisories (SUID/SGID bits kept, symlink targets
  # outside the destination, permissions applied through symlinks). zip arrives only
  # through webrtc-sys-build 0.3.19, LiveKit's latest release, as a build dependency
  # of webrtc-sys; the fix is zip >= 9 and no webrtc-sys-build takes it yet. It is
  # build time only, and every CI and release build that compiles webrtc-sys sets
  # LK_CUSTOM_WEBRTC to the pinned, checksummed libwebrtc, so webrtc-sys-build
  # downloads and extracts nothing there. (A local build without it would extract
  # LiveKit's own prebuilt from GitHub; CONTRIBUTING.md already says to set it.)
  # Re-check at the next webrtc-sys-build release, or on 2026-11-16, whichever is
  # first. Decided by Sean on 2026-10-17 (decisions log, GitLab #2).
  { id = "RUSTSEC-2026-0367", reason = "zip 0.6.6 via webrtc-sys-build 0.3.19, build time only, nothing extracted with LK_CUSTOM_WEBRTC; re-check at the next webrtc-sys-build release or 2026-11-16" },
  { id = "RUSTSEC-2026-0368", reason = "zip 0.6.6 via webrtc-sys-build 0.3.19, build time only, nothing extracted with LK_CUSTOM_WEBRTC; re-check at the next webrtc-sys-build release or 2026-11-16" },
  { id = "RUSTSEC-2026-0369", reason = "zip 0.6.6 via webrtc-sys-build 0.3.19, build time only, nothing extracted with LK_CUSTOM_WEBRTC; re-check at the next webrtc-sys-build release or 2026-11-16" },

  # zvariant 5.15.0, zbus_names 4.3.4, zvariant_derive 5.15.0: unmaintained notices
  # (2026-10-16), not vulnerabilities. Upstream merged all three into zbus 6.0.0 as
  # `zbus::wire`, `zbus::names` and its derive macros, but every zbus 5 release still
  # pulls them. zbus 5.19 arrives directly (district-desktop, for logind) and through
  # ashpd 0.13, oo7 0.6 and ksni 0.3, none of which takes zbus 6 yet. They go when
  # those three move and the tree carries only zbus 6 (issue #61). Review by
  # 2027-01-21. Decided by Sean on 2026-10-21 (decisions log, GitLab #2).
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6), via zbus 5.19 from district-desktop, ashpd, oo7, ksni; not a vulnerability; replacement tracked in #61; review by 2027-01-21" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6), via zbus 5.19 from district-desktop, ashpd, oo7, ksni; not a vulnerability; replacement tracked in #61; review by 2027-01-21" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6), via zbus 5.19 from district-desktop, ashpd, oo7, ksni; not a vulnerability; replacement tracked in #61; review by 2027-01-21" },
]

[licenses]
# The project is Apache-2.0. Permissive licences only; no copyleft reaches a
# shipped binary. MPL-2.0 is file-level copyleft and compatible with distributing
# an Apache-2.0 binary unmodified.
#
# The GTK and libadwaita C libraries themselves are LGPL, and they are linked
# dynamically from the system (or the Flatpak runtime), not compiled into the
# binary. This list governs the Rust crates, whose bindings are MIT.
#
# about.toml's `accepted` is this list, so the packages' THIRD-PARTY-LICENSES.txt
# accepts what this check allows; scripts/check-pins.py fails CI while they differ.
#
# The list is the same one the organisation's other Rust projects use. A few
# entries match nothing in today's tree, and cargo-deny prints a
# `license-not-encountered` warning for each (a warning, not a failure); they stay
# so the policy is decided once rather than reopened each time a dependency brings
# one of them in.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published to crates.io (`publish = false`).
# The core's crates are not workspace members, so their licence (Apache-2.0) is
# checked like any dependency's.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace carry no version and are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# District AI core for Rust, the one git source: Cargo.toml pins it by tag and
# Cargo.lock by commit, and scripts/check-pins.py holds the two together.
allow-git = ["https://github.com/distronode-corporation/district-core-rust"]
