[workspace]
resolver = "3"
members = [
  "crates/district-desktop",
  "crates/district-app",
]

[workspace.package]
version = "2.1.0"
edition = "2024"
# NOT 1.85, WHICH IS WHAT EDITION 2024 ALONE WOULD IMPLY. The floor is the highest
# `rust_version` any crate in the resolved dependency graph declares, and today that
# is 1.92: gtk4 0.11, the gtk-rs 0.22 crates under it (glib, gio, pango and the
# rest) and oo7 0.6 all declare it. Re-derive it after any Cargo.lock change rather
# than trusting this comment:
#
#   cargo metadata --format-version 1 --locked | python3 -c 'import json,sys; m=json.load(sys.stdin); ws=set(m["workspace_members"]); print(max((tuple(map(int, p["rust_version"].split("."))), p["name"]) for p in m["packages"] if p["id"] not in ws and p.get("rust_version")))'
#
# It prints the highest version and one crate that declares it. The result is the
# same with `--filter-platform x86_64-unknown-linux-gnu`, the only target shipped.
# Resolver 3 is MSRV-aware: `cargo update` prefers dependency versions that support
# this number, so the floor moves only when a manifest change forces it, and the
# `msrv` job in .github/workflows/ci.yml, which compiles the workspace at exactly
# this version, is what fails when it does.
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/distronode-corporation/district-linux"
authors = ["Distronode Corporation"]
# Neither crate is published to crates.io. They are one application split along
# its seams, and their APIs change whenever the application needs them to.
publish = false

[workspace.dependencies]
# District AI core for Rust: the shared crates both desktop apps build on (the
# data types, the HTTP client, sign-in, live updates, the application state, the
# call engine and what a desktop app keeps on the machine), in their own
# repository since 2.2.0. Pinned by tag, with the exact version beside it so that
# Cargo refuses a tag that does not hold that version; Cargo.lock records the
# commit the tag named, and `--locked` holds every build to it. All seven move
# together, in one change: scripts/check-pins.py fails CI while any of them names
# another tag, while Cargo.lock's commit is not the one the tag names, or while
# packaging/flatpak/cargo-sources.json lacks that commit. deny.toml's
# `[sources] allow-git` names this repository and no other.
#
# The core also sets `log`'s `max_level_warn` (district-live and district-call
# do), which compiles every log line below warn out of the whole build, this
# workspace's crates included; the core's SECURITY.md says why.
district-model = { git = "https://github.com/distronode-corporation/district-core-rust", tag = "v1.2.0", version = "=1.2.0" }
district-api = { git = "https://github.com/distronode-corporation/district-core-rust", tag = "v1.2.0", version = "=1.2.0" }
district-auth = { git = "https://github.com/distronode-corporation/district-core-rust", tag = "v1.2.0", version = "=1.2.0" }
district-live = { git = "https://github.com/distronode-corporation/district-core-rust", tag = "v1.2.0", version = "=1.2.0" }
district-core = { git = "https://github.com/distronode-corporation/district-core-rust", tag = "v1.2.0", version = "=1.2.0" }
district-host = { git = "https://github.com/distronode-corporation/district-core-rust", tag = "v1.2.0", version = "=1.2.0" }
district-call = { git = "https://github.com/distronode-corporation/district-core-rust", tag = "v1.2.0", version = "=1.2.0" }
# This workspace's own crate besides the app. Path only: it is not published, so
# there is no registry version to keep in step (deny.toml's `allow-wildcard-paths`
# relies on `publish = false` above).
district-desktop = { path = "crates/district-desktop" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
# Test only: temporary directories, so no test reads or writes the real user's
# XDG directories or keyring.
tempfile = "3.27.0"
# No default features: each crate turns on the parts of the runtime it uses, so a
# library crate does not quietly pull in the multi-threaded scheduler.
tokio = { version = "1.53.1", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
# The Secret Service client, which inside a Flatpak sandbox goes through the
# secret portal instead. Features are spelled out rather than inherited from
# `default`, so a change of upstream defaults cannot swap in another async runtime
# or OpenSSL.
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
# The system bus, for logind's sleep signal and its delay inhibitor. Already in
# the tree through oo7, with the same features: named directly because the app
# talks to logind itself.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# GTK 4.14 and libadwaita 1.5 are the floor because they are what Ubuntu 24.04
# ships, and Debian 13 ships newer. Raising either feature raises the oldest
# distribution the .deb can install on.
gtk4 = { version = "0.11.5", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
# The app's build script: compiles data/ into the gresource the binary carries
# (the .ui templates, the stylesheet, the ringtone and the icons), with the
# glib-compile-resources that ships beside the GTK development files.
glib-build-tools = "0.22.8"
# The app's two channels into the GTK main loop, from the effect runner's
# threads: the core's events, and the few calls only the main thread may make
# (opening a link, a notification, the ringtone, the window).
async-channel = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
strip = true
