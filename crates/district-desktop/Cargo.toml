[package]
name = "district-desktop"
description = "Linux desktop adapters for District AI for Linux: secret storage, XDG directories, the device name and logind's sleep signal. GTK-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
district-auth = { workspace = true }
# The files any desktop app keeps, placed in the XDG directories here, and the
# sleep protocol logind feeds.
district-host = { workspace = true }
# `Platform`, to name the Linux app in the settings file.
district-model = { workspace = true }
# logind's sleep signal: its stream.
futures-util = { workspace = true }
oo7 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `rt` for moving blocking file writes (with their fsyncs) off the async threads.
tokio = { workspace = true, features = ["rt"] }
# logind, on the system bus.
zbus = { workspace = true }

[dev-dependencies]
# For the `Settings` trait, to change a setting in a test.
district-core = { workspace = true }
tempfile = { workspace = true }
# `sync` for the lock oo7's keyring type holds, to build a file-backed one;
# `time` to wait for a test keyring daemon to start.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
