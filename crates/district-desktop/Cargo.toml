[package]
name = "district-desktop"
description = "Linux desktop adapters for District AI for Linux: secret storage, device id, settings and autostart. GTK-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
district-auth = { workspace = true }
# For the `Settings` trait `SettingsFile` implements.
district-core = { workspace = true }
# logind's sleep signal: its stream.
futures-util = { workspace = true }
oo7 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `rt` for moving blocking file writes (with their fsyncs) off the async threads;
# `time` for the longest the app holds the machine's sleep.
tokio = { workspace = true, features = ["rt", "time"] }
uuid = { workspace = true }
# The settings file.
toml = { workspace = true }
# logind, on the system bus.
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `sync` for the lock oo7's keyring type holds, to build a file-backed one;
# `time` to wait for a test keyring daemon to start; `test-util` to stop the
# clock while a test waits out the longest a sleep is held.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
