[package]
name = "district-host"
description = "The District AI desktop apps' files and sleep protocol, on any operating system: device id, refresh marker, settings file. GTK-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Nothing here may name a crate that only builds on Linux (no oo7, no zbus, no
# XDG crate): a Windows app builds on this crate too. district-desktop holds the
# Linux half.
[dependencies]
# `TokenFingerprint`, what the refresh-pending marker holds.
district-auth = { workspace = true }
# For the `Settings` trait `SettingsFile` implements.
district-core = { workspace = true }
# `Platform`, which names the app in the settings file's header.
district-model = { workspace = true }
serde = { workspace = true }
# `time` for the longest the app holds the machine's sleep.
tokio = { workspace = true, features = ["time"] }
# The settings file.
toml = { workspace = true }
# The device id, and the temporary files' names.
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` to stop the clock while a test waits out the longest a sleep is
# held.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }

[lints]
workspace = true
