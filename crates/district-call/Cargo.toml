[package]
name = "district-call"
description = "The District AI call engine. The LiveKit implementation sits behind the optional `livekit` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
district-core = { workspace = true }
# `sync` for the channel the engine's reports go out on. With `livekit`, also
# `rt` for the tasks each session runs and `time` for the limit on joining.
tokio = { workspace = true, features = ["sync"] }
# With `livekit` only. rustls to choose its crypto provider for the process:
# with LiveKit in the build, rustls has two compiled in (aws-lc-rs, which this
# workspace uses, and ring, which LiveKit's HTTP client asks for), and the
# signalling socket asks rustls for the process's default, which it cannot pick
# between two by itself.
futures-util = { workspace = true, optional = true }
livekit = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# To read the media server's address before anything is sent to it.
url = { workspace = true, optional = true }
# With `livekit` only, and only for its `max_level_warn` feature: see the
# workspace manifest. Held here as well as in district-live because this crate
# brings in the library that logs the room's key.
log = { workspace = true, optional = true }

[dev-dependencies]
# Test only: the claims of a signed-in session and the recorded answers a
# model is driven with, to join a room end to end.
district-auth = { workspace = true }
district-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# The LiveKit engine's tests: signing a media server credential (HS256), and a
# logger that writes every record, to prove none carries a secret.
base64 = { workspace = true }
hmac = { workspace = true }
log = { workspace = true, features = ["std"] }
pbkdf2 = { workspace = true }
sha2 = { workspace = true }

[features]
# The LiveKit call engine, `LiveKitCallEngine`. Off by default, so a default
# build compiles no WebRTC stack and has `UnavailableCallEngine`, which joins
# nothing and says so. Building with it links libwebrtc: see "Building with
# calls" in CONTRIBUTING.md.
livekit = ["dep:livekit", "dep:futures-util", "dep:log", "dep:rustls", "dep:url", "tokio/rt", "tokio/time", "tokio/macros"]

# The engine against a real media server on this machine: two engines in one
# room, the tone one sends and the other hears, encryption, the people in the
# room, the microphone, leaving, a lost server and what reaches the logs. They
# need the feature, and `livekit-server` (LIVEKIT_SERVER names it).
[[test]]
name = "engine"
path = "tests/engine/main.rs"
required-features = ["livekit"]

[lints]
workspace = true
