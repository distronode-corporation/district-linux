[package]
name = "district-call"
description = "The District AI call engine. The LiveKit implementation sits behind the optional `livekit` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
district-core = { workspace = true }
# `sync` for the channel the engine's reports go out on.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# Test only: the claims of a signed-in session and the recorded answers a
# model is driven with, to join a room end to end.
district-auth = { workspace = true }
district-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[features]
# The LiveKit call engine. Off by default, so a default build compiles no WebRTC
# stack. Empty for now: the LiveKit dependency is added here, as an optional
# dependency this feature enables, when the engine is written. Until then a
# build without it has `UnavailableCallEngine`, which joins nothing and says so.
livekit = []

[lints]
workspace = true
