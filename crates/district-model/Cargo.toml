[package]
name = "district-model"
description = "Serde data types for the District AI API and its live telemetry envelopes. No IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# This crate itself, with `strict-contracts` on. Cargo unifies the features of a
# package across the build, so every test build of this crate (plain `cargo test`,
# no flags) is strict, while a build of the app, which never pulls in
# dev-dependencies, is not.
district-model = { workspace = true, features = ["strict-contracts"] }
sha2 = { workspace = true }
syn = { workspace = true }

[features]
# For the contract tests. It adds `#[serde(deny_unknown_fields)]` to every type
# here that derives `Deserialize`, so a test fails on a field the server sends that
# this crate does not know about. A shipped build leaves it off and tolerates such
# a field, so an older app keeps working against a newer server.
strict-contracts = []

[lints]
workspace = true
