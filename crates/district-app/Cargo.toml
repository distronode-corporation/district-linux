[package]
name = "district-app"
description = "District AI for Linux, the GTK 4 and libadwaita desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# A library as well as the binary, so the smoke test can build the window.
[lib]
name = "district_app"
path = "src/lib.rs"

[[bin]]
name = "district-ai"
path = "src/main.rs"

# The headless smoke test. It needs a display and a session bus, so it is not
# part of a plain `cargo test`: CONTRIBUTING.md has the command, and CI runs it
# under Xvfb with `--features gtk-tests`.
[[test]]
name = "smoke"
path = "tests/smoke.rs"
harness = false
required-features = ["gtk-tests"]

# French from a compiled catalog, under a virtual display: a template's string
# looked up by its key, and the language gettext and the core each resolve.
# Needs msgfmt and the fr_CA.UTF-8 and en_US.UTF-8 locales (tests/l10n.rs).
[[test]]
name = "l10n"
path = "tests/l10n.rs"
harness = false
required-features = ["gtk-tests"]

[[test]]
name = "store_screenshots"
path = "tests/store_screenshots.rs"
harness = false
required-features = ["gtk-tests"]

[features]
# Builds the smoke test. Nothing in the app itself changes.
gtk-tests = []
# Calls: the LiveKit call engine in place of the one that joins nothing. Off by
# default, because it links libwebrtc (see "Building with calls" in
# CONTRIBUTING.md); a build without it rings nothing, dials nothing and says
# so.
voice = ["district-call/livekit"]
# Every build is French-capable since 3.0.0.
default = ["fr-ca"]
# Canadian French: the app follows a French desktop (src/l10n.rs), and the
# packages carry the compiled catalog (po/fr.po as district-ai.mo) and the
# desktop entry and metadata with their French. On by default since 3.0.0: its
# place in `default` is the one switch the packages follow
# (scripts/french-enabled.py), and deb.yml and flatpak.yml, which release.yml
# runs, fail a package that holds no French while it is on (or any while it is
# off). Without it the app writes English whatever the desktop's language and
# binds no catalog.
fr-ca = []

[dependencies]
async-channel = { workspace = true }
district-api = { workspace = true }
district-auth = { workspace = true }
district-call = { workspace = true }
district-core = { workspace = true }
district-crash = { workspace = true }
district-desktop = { workspace = true }
district-host = { workspace = true }
district-live = { workspace = true }
district-model = { workspace = true }
# The .ui templates' strings, looked up by GtkBuilder in the `district-ai` text
# domain (src/l10n.rs). `gettext-system` takes gettext from glibc, so nothing of
# GNU gettext is compiled or linked statically; without it the crate builds
# GNU gettext from source (LGPL).
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk4 = { workspace = true }
# Background mode (src/background.rs): the tray icon, a StatusNotifierItem
# and its menu over D-Bus (pure Rust on zbus, no GTK 3 or libappindicator;
# Unlicense), and the Background portal, which lets a Flatpak run with no
# window, start at login and say why in GNOME's Background Apps list.
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "background"] }
libadwaita = { workspace = true }
# A contact's research dossier is free-form JSON, shown as the text it holds.
serde_json = { workspace = true }
# The runtime the effect runner, the sign-in and the live updates run on,
# beside the GTK main loop: its own threads, a timer, and the one-shot replies
# from the main thread.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
glib-build-tools = { workspace = true }

[dev-dependencies]
# Test only: the smoke test answers the app's effects with the recorded server
# responses under the core's contracts/, found with `cargo metadata` and read
# as JSON (tests/contracts/).
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

# The .deb, built by cargo-deb through scripts/build-deb.sh (see "Packaging" in
# CONTRIBUTING.md), always with calls. Built on Ubuntu 24.04, whose glibc, GTK
# 4.14 and libadwaita 1.5 are the floor: it installs on Ubuntu 24.04, Debian 13
# and newer. The Depends and Recommends below are asserted, exactly as they
# come out, by .github/workflows/deb.yml, so a change here changes that too.
[package.metadata.deb]
name = "district-ai"
maintainer = "Distronode Corporation <opensource@distronode.com>"
copyright = "2026 Distronode Corporation"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A native GTK 4 and libadwaita desktop client for District AI, the AI voice \
receptionist from Distronode: the calls and their transcripts, the inbox, \
contacts, the workspace settings, and calls on the desktop. You need a \
District AI account to use it."""
section = "comm"
priority = "optional"
features = ["voice"]
# `$auto` is what the binary links (dpkg-shlibdeps). The rest is what it loads
# while running, which dpkg-shlibdeps cannot see:
# - libpulse0: libwebrtc's audio module opens libpulse.so.0 for the microphone
#   and the speakers.
# - libgtk-4-media-gstreamer: GTK's media backend, which plays the ringtone.
#   Ubuntu 26.04 folds it into libgtk-4-1, which provides the name.
# - gstreamer1.0-plugins-base: without its `playbin`, GTK aborts the whole app
#   the first time a call rings.
# - gstreamer1.0-plugins-good: the WAV decoder and the audio sinks; without it
#   the ringtone is silent.
depends = "$auto, libpulse0, libgtk-4-media-gstreamer, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good"
# Any Secret Service keeps the sign-in (without one the app keeps it until it
# quits, and says so); the portals are how GTK opens links and files and shows
# notifications; a PulseAudio server (PipeWire's, on most desktops) carries a
# call's audio.
recommends = "gnome-keyring | kwallet6 | keepassxc, xdg-desktop-portal, pipewire-pulse | pulseaudio"
assets = [
  ["target/release/district-ai", "usr/bin/", "755"],
  # Written by scripts/build-deb.sh: the files under data/, with the catalog's
  # French beside the English when French is on.
  ["target/release/metadata/com.distronode.DistrictAI.desktop", "usr/share/applications/", "644"],
  ["target/release/metadata/com.distronode.DistrictAI.metainfo.xml", "usr/share/metainfo/", "644"],
  ["data/icons/hicolor/scalable/apps/com.distronode.DistrictAI.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["data/icons/hicolor/symbolic/apps/com.distronode.DistrictAI-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
  # Written by scripts/build-deb.sh: the D-Bus service from its template, with
  # /usr/bin for @bindir@, the licence texts of libwebrtc, which NOTICE says
  # must travel with a build that links it, and those of every crate the
  # binary links (cargo-about).
  ["target/release/com.distronode.DistrictAI.service", "usr/share/dbus-1/services/", "644"],
  ["target/release/libwebrtc-LICENSE.md", "usr/share/doc/district-ai/", "644"],
  ["target/release/THIRD-PARTY-LICENSES.txt", "usr/share/doc/district-ai/", "644"],
  ["../../NOTICE", "usr/share/doc/district-ai/", "644"],
]

# The .deb with French, built by scripts/build-deb.sh when the `fr-ca` feature
# is on: the same package and the same assets, and the French catalog, which
# the script compiles from po/fr.po first.
[package.metadata.deb.variants.fr-ca]
name = "district-ai"
merge-assets.append = [
  ["target/release/locale/fr/LC_MESSAGES/district-ai.mo", "usr/share/locale/fr/LC_MESSAGES/", "644"],
]
