[package]
name = "district-live"
description = "The District AI live telemetry WebSocket client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
district-api = { workspace = true }
district-model = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
# Only for its `max_level_warn` feature: see the workspace manifest.
log = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `net` for the TCP connection, `time` for renewal, backoff and the silence
# limit, `sync` for the update channel and the stop signal, `rt` for the task
# each connection runs in, `macros` for `select!`.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# `test-util` lets a test stop and step the clock instead of sleeping for real;
# `io-util` is for the in-memory connections the tests use.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
wiremock = { workspace = true }

[lints]
workspace = true
